<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>현단아 퀴즈 — OBS 공개 화면</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#f0f2f6;color:#26364d}
main{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.8vh;padding:4vh 5vw}
h1{font-size:clamp(24px,3vw,54px);text-align:center;margin:0;font-weight:850}
#photoStack{display:none;position:relative;height:65%;width:78%;min-height:0}
#photoStack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s ease-in-out}
#photoStack img[hidden]{display:none}
@media(prefers-reduced-motion:reduce){#photoStack img{transition:none}}
#focusSource{font-size:clamp(14px,1.5vw,25px);color:#3b4966;font-weight:750;max-width:85%;text-align:center;word-break:break-word}
#focusName{font-size:clamp(19px,2vw,34px);font-weight:900}

body[data-stage='emergency']{background:#323b4c;color:#fff}
body[data-stage='emergency'] h1{font-size:clamp(22px,2.7vw,48px)}
#status{position:fixed;right:14px;bottom:10px;font-size:12px;color:#8090a5;opacity:.75}
</style>
</head>
<body data-stage="emergency">
<main><h1 id="round">연결 확인 중</h1><div id="focusSource" class="focusSource" style="display:none"></div><div id="photoStack"><img id="photoPrevious" alt="" hidden /><img id="photo" alt="방송 공개 이미지" hidden /></div><div id="focusName" class="focusName" style="display:none"></div></main>
<div id="status">현단아 퀴즈 OBS 화면 · 임시 출력 / 최종 디자인은 별도 연결</div>
<script>
(() => {
  'use strict';
  let revision = null;
  const $ = (id) => document.getElementById(id);
  function screen(st, connected) {
    const stage = connected && st && typeof st.stage === 'string' ? st.stage : 'emergency';
    document.body.dataset.stage = stage;
    $('round').textContent = stage === 'emergency' ? '송출 연결이 끊겼습니다' : stage === 'waiting' ? '잠시 후 시작합니다' : stage === 'title' ? '현단아 연예인 합성 퀴즈' : stage === 'summary' ? `${st.round} · 정답 공개` : st.round || '라운드 01';
    const img = $('photo'),oldImg=$('photoPrevious'),stack=$('photoStack');
    const next=(stage === 'question' || stage === 'reveal') && st?.image?.startsWith('data:image/png;base64,') ? st.image : null;
    const previous=img.getAttribute('src');
    if(!next){stack.style.display='none';img.hidden=true;img.removeAttribute('src');oldImg.hidden=true;oldImg.removeAttribute('src');}
    else if(previous!==next){
      if(previous){oldImg.src=previous;oldImg.hidden=false;oldImg.style.opacity='1';}
      img.src=next;img.hidden=false;stack.style.display='block';
      img.style.transition='none';img.style.opacity=previous?'0':'1';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        img.style.transition='opacity .6s ease-in-out';img.style.opacity='1';oldImg.style.opacity='0';
      }));
    }else{stack.style.display='block';img.hidden=false;}
    const sourceEl=$('focusSource'),nameEl=$('focusName');
    if(stage==='reveal'&&st.focus&&typeof st.focus.name==='string'){
      sourceEl.textContent=st.focus.source?'출처 : '+st.focus.source:'';
      nameEl.textContent=st.focus.name;
      sourceEl.style.display=st.focus.source?'block':'none';
      nameEl.style.display='block';
    }else{sourceEl.textContent='';nameEl.textContent='';sourceEl.style.display='none';nameEl.style.display='none';}
    // Only the focused original is shown here. The separate broadcast-design template
    // may render st.revealed[] in A/B/C/D answer slots as each person becomes public.
    $('status').textContent=connected?'OBS 연결 정상 · 임시 디자인':'OBS 제어 연결 대기 · 안전 화면';
  }
  async function poll() {
    try {
      const url=`/api/public?rev=${encodeURIComponent(revision ?? '')}`;
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),2500);
      let response;
      try {response=await fetch(url,{cache:'no-store',signal:controller.signal});}
      finally {clearTimeout(timer);}
      if (!response.ok) throw new Error('HTTP '+response.status);
      const result=await response.json();
      revision=result.revision;
      if (!result.unchanged) screen(result.state,result.connected);
    } catch (_) {revision=null;screen(null,false);}
    setTimeout(poll, 450);
  }
  screen(null,false);
  void poll();
  // For independent design integration later: documented public-only state adapter.
  window.HyundanaOBS={getProtocol:()=> 'GET /api/public?rev=<last revision>'};
})();
</script>
</body>
</html>
