<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>현단아 뉴뀨? · OBS 송출 전용</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#171024;overflow:hidden;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#scene{position:absolute;width:1672px;height:941px;overflow:hidden;transform-origin:0 0;isolation:isolate;background:#271536}
#questionBg,#answerBg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#questionBg,#answerBg{display:none}
#scene[data-stage='question'] #questionBg{display:block}
#scene[data-stage='reveal'] #answerBg{display:block}
#roundNum{position:absolute;left:101px;top:72px;width:272px;height:63px;display:none;align-items:center;justify-content:center;white-space:nowrap;text-align:center;line-height:1;font-weight:1000;font-size:45px;letter-spacing:-2px;color:#3f136f;text-shadow:0px 1px 0 #fff,0px 2px 1px #ffdcff,1px 4px 4px #a738bf;filter:drop-shadow(0px 1px 1px #a9c6ff)}
#scene[data-stage='question'] #roundNum,#scene[data-stage='reveal'] #roundNum{display:flex}
#mainStack{position:absolute;display:none;overflow:hidden;align-items:center;justify-content:center}
#scene[data-stage='question'] #mainStack,#scene[data-stage='reveal'] #mainStack{display:flex}
#scene[data-stage='question'] #mainStack{left:80px;top:228px;width:1092px;height:595px}
#scene[data-stage='reveal'] #mainStack{left:82px;top:263px;width:375px;height:562px;border-radius:13px}
#mainStack img{position:absolute;max-width:100%;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease-in-out;}
#scene[data-stage='reveal'] #mainStack img{object-fit:cover}
#answerCards{display:none;position:absolute;inset:0;pointer-events:none}
#scene[data-stage='reveal'] #answerCards{display:block}
.answerCard{position:absolute;top:332px;width:199px;height:261px;border-radius:13px;overflow:hidden;display:none;align-items:center;justify-content:center;background:transparent}
.answerCard img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;}
.answerCard[data-col='0']{left:523px}.answerCard[data-col='1']{left:772px}.answerCard[data-col='2']{left:1015px}
.sourceText,.nameText{position:absolute;display:none;text-align:center;align-items:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3c0b6a;font-weight:900;padding:0 6px;line-height:1.15;text-shadow:0 1px 0px #fff8ff}
.sourceText{top:263px;width:208px;height:38px;font-size:24px}
.nameText{top:620px;width:208px;height:52px;font-size:32px;letter-spacing:-.5px}
.sourceText[data-col='0'],.nameText[data-col='0']{left:518px}
.sourceText[data-col='1'],.nameText[data-col='1']{left:767px}
.sourceText[data-col='2'],.nameText[data-col='2']{left:1010px}
#videoPanel{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:none;background:#171024}
#scene[data-stage='summary'] #videoPanel{display:block}
#safety{display:none;position:absolute;inset:0;background:#24152f;color:white;font-size:46px;font-weight:800;align-items:center;justify-content:center}
#scene[data-stage='emergency'] #safety{display:flex}
#endPanel,#standbyPanel,#introPanel,#noticePanel,#rulesPanel{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#scene[data-stage='waiting'] #standbyPanel{display:block}
#scene[data-stage='title'] #introPanel{display:block}
#scene[data-stage='notice'] #noticePanel{display:block}
#scene[data-stage='rules'] #rulesPanel{display:block}
#scene[data-stage='end'] #endPanel{display:block}
#endFallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-size:70px;font-weight:900;background:radial-gradient(circle,#693183,#29133f)}
#scene[data-stage='end'][data-end-image='missing'] #endPanel{display:none}
#scene[data-stage='end'][data-end-image='missing'] #endFallback{display:flex}
#cardWarning{position:absolute;left:501px;top:320px;max-width:720px;padding:15px;color:#ffd4e9;font-size:23px;display:none}
#videoWarn{position:absolute;top:46%;left:20%;width:60%;padding:18px;border-radius:10px;background:rgba(32,14,55,.93);color:white;text-align:center;font-size:29px;font-weight:800;display:none}
#scene[data-stage='summary'] #videoWarn:not([hidden]){display:block}
@media(prefers-reduced-motion:reduce){#mainStack img{transition:none}}
</style></head>
<body><div id="scene" data-stage="emergency">
<img id="questionBg" alt="문제 공개 디자인"/><img id="answerBg" alt="정답 공개 디자인"/>
<div id="roundNum" aria-label="현재 라운드"></div>
<div id="mainStack"><img id="backPhoto" alt=""/><img id="frontPhoto" alt="합성 사진 또는 공개된 원본"/></div>
<div id="answerCards"></div><img id="standbyPanel" alt="참가자 세팅 대기 · 준비중"><img id="introPanel" alt="현단아의 뉴뀨? 콘텐츠 오프닝"><img id="noticePanel" alt="현단아의 뉴뀨 안내사항"><img id="rulesPanel" alt="현단아의 뉴뀨 게임 규칙"><img id="endPanel" alt="현단아의 뉴뀨? · 감사합니다"><div id="endFallback">♡ 감사합니다 ♡</div><video id="videoPanel" muted autoplay playsinline preload="auto"></video><div id="videoWarn" hidden></div><div id="safety">방송 화면 준비 중</div><div id="cardWarning"></div>
</div>
<script>
(()=>{'use strict';
 const $=(s)=>document.getElementById(s);
 const ROOT={w:1672,h:941};let revision=null,sceneStage='emergency',photoUrl='',backIsFront=false,moveToken=0;
 const questionBg='/assets/question.webp';
 const answerBg='/assets/answer.webp';
 const waitVideo='/assets/next.mp4';
 const scene=$('scene'),vid=$('videoPanel'),vidWarn=$('videoWarn');
 const videoError=message=>{vidWarn.textContent=message;vidWarn.hidden=false;};
 vid.onerror=()=>videoError('다음 문제 대기 MP4를 열 수 없어요. 설치 파일을 확인해주세요.');
 vid.onloadeddata=()=>{vidWarn.hidden=true;};
 vid.onended=()=>{vid.pause();}; // Keep final frame until host chooses the next scene.

 $('questionBg').src=questionBg;$('answerBg').src=answerBg;vid.src=waitVideo;
 $('standbyPanel').src='/assets/standby.webp';$('introPanel').src='/assets/intro.webp';
 // Local OBS reads locally persisted posters; remote spectators read Worker assets.
 $('noticePanel').src='/assets/notice.png';$('rulesPanel').src='/assets/rules.png';
 const endPanel=$('endPanel');scene.dataset.endImage='missing';endPanel.onload=()=>{scene.dataset.endImage='ready'};endPanel.onerror=()=>{scene.dataset.endImage='missing'};endPanel.src='/assets/end.webp';
 const slots=['A','B','C'];
 const cards=[];
 for(let i=0;i<3;i++){
   const box=document.createElement('div');box.className='answerCard';box.dataset.col=i;
   const image=document.createElement('img');image.alt='공개된 원본 사진 '+slots[i];box.appendChild(image);
   const source=document.createElement('div');source.className='sourceText';source.dataset.col=i;
   const name=document.createElement('div');name.className='nameText';name.dataset.col=i;
   $('answerCards').append(box,source,name);cards.push({box,image,source,name});
 }
 function resize(){const scale=Math.min(innerWidth/ROOT.w,innerHeight/ROOT.h);scene.style.transform=`translate(${(innerWidth-ROOT.w*scale)/2}px,${(innerHeight-ROOT.h*scale)/2}px) scale(${scale})`;}
 addEventListener('resize',resize);resize();
 function fitText(el,max,min){
  // Measure rendered Hangul/Latin widths inside the actual pink caption bar.
  // Character-count heuristics clipped long names even when the field was centered.
  const style=getComputedStyle(el),font=style.fontFamily,weight=style.fontWeight;
  const canvas=fitText.measureCanvas||(fitText.measureCanvas=document.createElement('canvas'));
  const ctx=canvas.getContext('2d'),available=Math.max(20,el.clientWidth-18);
  let size=max;
  while(size>min){
    ctx.font=weight+' '+size+'px '+font;
    if(ctx.measureText(el.textContent||'').width<=available)break;
    size--;
  }
  el.style.fontSize=Math.max(min,size)+'px';
}
 function setPhoto(next){if(!next || typeof next!=='string' || !next.match(/^data:image\/(png|webp);base64,/)){photoUrl='';$('frontPhoto').style.opacity=0;$('backPhoto').style.opacity=0;return;}
   if(next===photoUrl)return;
   const front=$('frontPhoto'),back=$('backPhoto');const token=++moveToken;photoUrl=next;
   // Swap buffers; the currently visible original remains behind the new original during a fade.
   back.src=front.src||next;back.style.transition='none';back.style.opacity=front.src?'1':'0';
   front.style.transition='none';front.style.opacity='0';front.src=next;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token!==moveToken)return;front.style.transition='opacity 1s ease-in-out';back.style.transition='opacity 1s ease-in-out';front.style.opacity='1';back.style.opacity='0';}));
 }
 function resetPhotos(){photoUrl='';++moveToken;$('frontPhoto').removeAttribute('src');$('backPhoto').removeAttribute('src');$('frontPhoto').style.opacity='0';$('backPhoto').style.opacity='0';}
 function roundLabel(str){if(String(str||'').toLowerCase().includes('example')||String(str||'').includes('예시'))return '예시 문제';const m=String(str||'').match(/(\d+)/);return 'ROUND '+(m?String(Number(m[1])).padStart(2,'0'):'01');}
 function render(st,connected){let stage=(connected&&st&&typeof st.stage==='string')?st.stage:'emergency';if(!['question','reveal','summary','waiting','title','notice','rules','emergency','end'].includes(stage))stage='emergency';
   const changed=stage!==sceneStage;sceneStage=stage;scene.dataset.stage=stage;
   $('roundNum').textContent=roundLabel(st?.round);
   if(stage==='summary'){
      if(changed){
        vidWarn.hidden=true;
        try{vid.currentTime=0;}catch(e){}
        vid.loop=false;
        vid.play().catch(err=>videoError('MP4 재생 실패: '+(err?.message||'미디어 오류')+' · 설치 파일을 확인해주세요.'));
      }
   }else{vid.pause();vidWarn.hidden=true;}
   if(stage==='question'||stage==='reveal'){setPhoto(st?.image)}else if(changed){resetPhotos();}
   for(let i=0;i<3;i++){
     const p=stage==='reveal' && Array.isArray(st?.revealed)?st.revealed.find(x=>x?.slot===slots[i] && typeof x?.image==='string' && x.image.match(/^data:image\/(png|webp);base64,/)):null;
     const c=cards[i];c.box.style.display=p?'flex':'none';c.source.style.display=p?'flex':'none';c.name.style.display=p?'flex':'none';
     if(p){if(c.image.src!==p.image)c.image.src=p.image;c.source.textContent=p.source?'출처 : '+p.source:'';c.name.textContent=p.name||'';fitText(c.source,24,12);fitText(c.name,32,18);}
     else {c.image.removeAttribute('src');c.source.textContent='';c.name.textContent='';}
   }
 }
 async function poll(){try{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),2700);
   let response;try{response=await fetch('/api/public?rev='+encodeURIComponent(revision??''),{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timer)}
   if(!response.ok)throw new Error('HTTP '+response.status);
   const d=await response.json();revision=d.revision;
   if(!d.unchanged)render(d.state,d.connected);
  }catch(e){/* Preserve last valid scene during temporary local network/renderer errors. */}setTimeout(poll,350)}
 // Local OBS continues reading localhost. Public viewers use one persistent,
 // hibernating WebSocket: no HTTP polling (and therefore no per-viewer DO quotas).
 const remote=location.hostname!=='127.0.0.1'&&location.hostname!=='localhost';
 let spectatorSocket=null,retryDelay=1000,remoteStatus='connecting',retryTimer=null,initialTimer=null;
 const viewerSignal=document.createElement('div');
 viewerSignal.setAttribute('aria-live','polite');
 viewerSignal.style.cssText='position:absolute;bottom:12px;left:14px;z-index:50;padding:6px 12px;border-radius:8px;background:#24152fe6;color:#fff;font:600 15px system-ui;display:none;pointer-events:none';
 viewerSignal.textContent='실시간 화면 연결 중…';
 if(remote){document.body.appendChild(viewerSignal);viewerSignal.style.display='block'}
 const signal=(message)=>{
   if(!remote)return;
   viewerSignal.style.display=message?'block':'none';
   if(message)viewerSignal.textContent=message;
 };
 function scheduleReconnect(){
   if(retryTimer)return;
   remoteStatus='reconnecting';
   signal('연결 재시도 중 · 마지막 정상 화면 유지');
   const wait=retryDelay;
   retryDelay=Math.min(12000,Math.round(retryDelay*1.6));
   retryTimer=setTimeout(()=>{retryTimer=null;openSpectatorStream()},wait);
 }
 function openSpectatorStream(){
   if(!remote)return;
   try{
     const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/stream');
     spectatorSocket=socket;
     remoteStatus='connecting';
     signal('실시간 화면 연결 중…');
     let received=false;
     initialTimer=setTimeout(()=>{if(!received&&spectatorSocket===socket)socket.close()},12000);
     socket.onopen=()=>{retryDelay=1000;remoteStatus='connected';};
     socket.onmessage=event=>{
       try{
         const data=JSON.parse(event.data);
         if(!data?.state){signal('화면 상태 동기화 중…');return}
         received=true;clearTimeout(initialTimer);
         const nextRev=String(data.revision);
         if(revision!==nextRev){revision=nextRev;render(data.state,data.connected!==false)}
         remoteStatus='connected';signal('');
       }catch(e){remoteStatus='message-error';signal('화면 수신 오류 · 자동 재연결 중');socket.close()}
     };
     socket.onclose=async()=>{
       clearTimeout(initialTimer);
       if(spectatorSocket!==socket)return;
       // A disconnected authorized spectator keeps their last scene. Only a
       // disconnection triggers one access check; there is no periodic polling.
       try{
         const res=await fetch('/access/status',{credentials:'same-origin',cache:'no-store'});
         if(res.ok){
           const access=await res.json();
           if(access.required&&!access.ok){
             remoteStatus='reauth-required';
             signal('입장코드가 변경되었거나 인증이 만료되었어요. 새로고침 후 다시 입장해 주세요.');
             return;
           }
         }
       }catch(_){}
       scheduleReconnect();
     };
     socket.onerror=()=>{remoteStatus='network-error';socket.close()};
   }catch(e){scheduleReconnect()}
 }
 render(null,false);
 if(remote)openSpectatorStream();else void poll();
 window.HyundanaOBS={version:'1.8.10',getProtocol:()=>remote?'WebSocket /stream (push)':'GET /api/public?rev=<last revision>',getSceneState:()=>sceneStage,getConnection:()=>remoteStatus};
})();
</script></body></html>
