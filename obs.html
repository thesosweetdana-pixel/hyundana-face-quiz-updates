<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>현단아 퀴즈 — OBS 공개 화면</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#f0f2f6;color:#26364d}
main{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.8vh;padding:4vh 5vw}
h1{font-size:clamp(24px,3vw,54px);text-align:center;margin:0;font-weight:850}
@keyframes photoEnter{from{opacity:.2}to{opacity:1}}
#photo.face-enter{animation:photoEnter .42s ease-out}
#photo{display:none;max-height:66%;max-width:76%;min-height:0;object-fit:contain}
#focusSource{font-size:clamp(14px,1.5vw,25px);color:#3b4966;font-weight:750;max-width:85%;text-align:center;word-break:break-word}
#focusName{font-size:clamp(19px,2vw,34px);font-weight:900}
#hint{display:none;border-radius:14px;border:1px solid #d3d9e5;background:white;max-width:82%;padding:12px 22px;font-size:clamp(18px,2vw,36px);text-align:center}
#revealed{display:none;gap:1.5vw;flex-wrap:wrap;align-items:center;justify-content:center;max-height:28%;overflow:hidden}
.person{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:clamp(12px,1.35vw,22px);font-weight:750}
.person img{width:9.1vw;height:9.1vw;object-fit:contain;background:transparent}
body[data-stage='summary'] #revealed{max-height:80%}
body[data-stage='summary'] .person img{width:15vw;height:15vw}
body[data-stage='emergency']{background:#323b4c;color:#fff}
body[data-stage='emergency'] h1{font-size:clamp(22px,2.7vw,48px)}
#status{position:fixed;right:14px;bottom:10px;font-size:12px;color:#8090a5;opacity:.75}
</style>
</head>
<body data-stage="emergency">
<main><h1 id="round">연결 확인 중</h1><div id="focusSource" class="focusSource" style="display:none"></div><img id="photo" alt="방송 공개 이미지" /><div id="focusName" class="focusName" style="display:none"></div><div id="hint"></div><div id="revealed"></div></main>
<div id="status">현단아 퀴즈 OBS 화면 · 임시 디자인</div>
<script>
(() => {
  'use strict';
  let revision = null;
  const $ = (id) => document.getElementById(id);
  function screen(st, connected) {
    const stage = connected && st && typeof st.stage === 'string' ? st.stage : 'emergency';
    document.body.dataset.stage = stage;
    $('round').textContent = stage === 'emergency' ? '송출 연결이 끊겼습니다' : stage === 'waiting' ? '잠시 후 시작합니다' : stage === 'title' ? '현단아 연예인 합성 퀴즈' : stage === 'summary' ? `${st.round} · 정답 공개` : st.round || '라운드 01';
    const img = $('photo'), hint = $('hint'), cards = $('revealed');
    if ((stage === 'question' || stage === 'reveal') && st.image && st.image.startsWith('data:image/png;base64,')) {
      img.src=st.image;img.style.display='block';img.classList.remove('face-enter');void img.offsetWidth;img.classList.add('face-enter');
    } else {img.removeAttribute('src');img.style.display='none';}
    const sourceEl=$('focusSource'),nameEl=$('focusName');
    if(stage==='reveal'&&st.focus&&typeof st.focus.name==='string'){
      sourceEl.textContent=st.focus.source?'출처 : '+st.focus.source:'';
      nameEl.textContent=st.focus.name;
      sourceEl.style.display=st.focus.source?'block':'none';
      nameEl.style.display='block';
    }else{sourceEl.textContent='';nameEl.textContent='';sourceEl.style.display='none';nameEl.style.display='none';}
    if ((stage === 'question' || stage === 'reveal') && st.hint) {
      hint.textContent=st.hint;hint.style.display='block';
    } else { hint.textContent='';hint.style.display='none'; }
    cards.replaceChildren();
    if ((stage === 'reveal' || stage === 'summary') && Array.isArray(st.revealed)) {
      for (const p of st.revealed) {
        if (!p || !p.image || !p.image.startsWith('data:image/png;base64,')) continue;
        const item=document.createElement('div');item.className='person';
        const pic=document.createElement('img');pic.alt='공개한 얼굴';pic.src=p.image;
        const name=document.createElement('span');name.textContent=`${p.slot} · ${p.name}`;
        const source=document.createElement('span');source.textContent=p.source?'출처 : '+p.source:'';
        item.append(source,pic,name);cards.append(item);
      }
    }
    cards.style.display=cards.childElementCount?'flex':'none';
    $('status').textContent=connected?'OBS 연결 정상 · 임시 디자인':'OBS 제어 연결 대기 · 안전 화면';
  }
  async function poll() {
    try {
      const url=`/api/public?rev=${encodeURIComponent(revision ?? '')}`;
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),2500);
      let response;
      try {response=await fetch(url,{cache:'no-store',signal:controller.signal});}
      finally {clearTimeout(timer);}
      if (!response.ok) throw new Error('HTTP '+response.status);
      const result=await response.json();
      revision=result.revision;
      if (!result.unchanged) screen(result.state,result.connected);
    } catch (_) {revision=null;screen(null,false);}
    setTimeout(poll, 450);
  }
  screen(null,false);
  void poll();
  // For independent design integration later: documented public-only state adapter.
  window.HyundanaOBS={getProtocol:()=> 'GET /api/public?rev=<last revision>'};
})();
</script>
</body>
</html>
